name: Test / Nix

on:
  workflow_dispatch:
  workflow_call:

jobs:
  nix-build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/general-intelligence-systems/runs-on-nix:latest
    steps:
      - uses: actions/checkout@v4

      - name: Check nix flake
        env:
          HOME: /root
        run: |
          git config --global --add safe.directory '*'
          rm -rf /homeless-shelter
          nix flake check
