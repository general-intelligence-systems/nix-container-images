name: Dispatch Image Builds

on:
  workflow_dispatch:
  push:
    branches: [trench]
    paths:
      - "flake.nix"
      - "flake.lock"

jobs:
  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31.10.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
