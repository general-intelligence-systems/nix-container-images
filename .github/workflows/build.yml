name: Build and Push Container Image

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image name (matches filename in images/ without .nix)"
        required: true
        type: string
  workflow_call:
    inputs:
      image:
        description: "Image name (matches filename in images/ without .nix)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    container: ghcr.io/general-intelligence-systems/nix-for-github-actions:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: nix build .#${{ inputs.image }}

      - name: Load image into Docker
        run: docker load < result

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: docker push ghcr.io/general-intelligence-systems/${{ inputs.image }}:latest
