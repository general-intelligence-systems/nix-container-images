name: Build and Push Runner Image

on:
  workflow_dispatch:
  push:
    branches: [trench]
    paths:
      - "flake.nix"
      - "flake.lock"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31.10.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build patched runner image context
        run: nix build .#runner-images-ubuntu-slim

      - name: Build Docker image
        run: docker build -t ghcr.io/general-intelligence-systems/nix-for-github-actions:latest result

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: docker push ghcr.io/general-intelligence-systems/nix-for-github-actions:latest
