name: Build and Push Runner Images

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [trench]
    paths:
      - "runners/*.nix"
      - "flake.nix"
      - "flake.lock"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/general-intelligence-systems/runs-on-nix:latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build nix-for-github-actions context
        env:
          HOME: /root
        run: |
          git config --global --add safe.directory '*'
          rm -rf /homeless-shelter
          unset LD_LIBRARY_PATH
          nix build .#nix-for-github-actions

      - name: Build nix-for-github-actions image
        run: docker build -t ghcr.io/general-intelligence-systems/nix-for-github-actions:latest result

      - name: Push nix-for-github-actions
        run: docker push ghcr.io/general-intelligence-systems/nix-for-github-actions:latest

      - name: Build k3s-runner
        env:
          HOME: /root
        run: |
          rm -rf /homeless-shelter
          unset LD_LIBRARY_PATH
          nix run .#k3s-runner

      - name: Push k3s-runner
        run: docker push ghcr.io/general-intelligence-systems/k3s-runner:latest
