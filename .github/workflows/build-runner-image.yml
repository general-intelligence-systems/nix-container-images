name: Build and Push Runner Images

on:
  workflow_dispatch:
  push:
    branches: [trench]
    paths:
      - "runners/*.nix"
      - "flake.nix"
      - "flake.lock"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31.10.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull nixos/nix base
        run: docker pull nixos/nix:latest

      - name: Build nix-for-github-actions
        run: nix run .#nix-for-github-actions

      - name: Push nix-for-github-actions
        run: docker push ghcr.io/general-intelligence-systems/nix-for-github-actions:latest

      - name: Build k3s-runner
        run: nix run .#k3s-runner

      - name: Push k3s-runner
        run: docker push ghcr.io/general-intelligence-systems/k3s-runner:latest
